name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build "setuptools>=77" wheel
      - run: python check_tests.py
      - run: python -m pip install git+https://github.com/chalkbadger/wirth@df613c93fdff0f51c1e36a9549cbc607965fe7f1
      - run: wirth validate
  old-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.9'
      - name: Python 3.9 names the command to run and where to share feedback, and exits 2
        run: python tests/runs_without_a_coding_agent/old_python_check.py
      - name: The same with Apple's own python3, unless it is 3.11 or newer
        if: runner.os == 'macOS'
        run: |
          if /usr/bin/python3 -c 'import sys; sys.exit(sys.version_info >= (3, 11))'; then
            /usr/bin/python3 tests/runs_without_a_coding_agent/old_python_check.py
          else
            echo "Skipped: /usr/bin/python3 is $(/usr/bin/python3 -V 2>&1), 3.11 or newer, so it can't show the old-Python message."
          fi
  python-recovery:
    name: Python 3.9 to 3.15 recovery
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Download the source archive for this commit
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              source_repository="${PR_HEAD_REPOSITORY:?missing pull request head repository}"
              source_revision="${PR_HEAD_SHA:?missing pull request head SHA}"
              ;;
            push)
              source_repository="$GITHUB_REPOSITORY"
              source_revision="$GITHUB_SHA"
              ;;
            *) echo "Unsupported event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          work="$RUNNER_TEMP/stay-safe-recovery"
          mkdir "$work"
          curl --fail --location --max-time 60 "https://github.com/$source_repository/archive/$source_revision.zip" --output "$work/source.zip"
          ditto -x -k "$work/source.zip" "$work"
          source_dir="$work/${source_repository##*/}-$source_revision"
          test "$(cat "$source_dir/stay_safe/release.txt")" = "$source_revision"
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        id: old
        with:
          python-version: '3.9'
      - name: Observe the old default stopping with setup guidance
        env:
          OLD_PYTHON: ${{ steps.old.outputs.python-path }}
        run: |
          cd "$SOURCE_DIR"
          python3 --version
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 9)'
          set +e
          PATH="$(dirname "$OLD_PYTHON")" "$OLD_PYTHON" -B -m stay_safe --config tests/runs_without_a_coding_agent/sample.toml --format markdown > "$RUNNER_TEMP/old.stdout" 2> "$RUNNER_TEMP/old.stderr"
          status=$?
          set -e
          cat "$RUNNER_TEMP/old.stdout" "$RUNNER_TEMP/old.stderr"
          echo "Old Python exit status: $status"
          test "$status" = 2
          test ! -s "$RUNNER_TEMP/old.stdout"
          grep -F 'stay-safe needs Python 3.11 or newer; this is Python 3.9.' "$RUNNER_TEMP/old.stderr"
          grep -F 'https://github.com/chalkbadger/stay-safe/blob/main/docs/usage.md#python-setup' "$RUNNER_TEMP/old.stderr"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        id: supported
        with:
          python-version: '3.15'
          update-environment: false
      - name: Recover using the explicit newer interpreter
        env:
          SUPPORTED_PYTHON: ${{ steps.supported.outputs.python-path }}
        run: |
          cd "$SOURCE_DIR"
          python3 --version
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 9)'
          "$SUPPORTED_PYTHON" --version
          "$SUPPORTED_PYTHON" -c 'import sys; assert sys.version_info[:2] == (3, 15)'
          set +e
          "$SUPPORTED_PYTHON" -B -m stay_safe --config tests/runs_without_a_coding_agent/sample.toml --format markdown > "$RUNNER_TEMP/new.stdout" 2> "$RUNNER_TEMP/new.stderr"
          status=$?
          set -e
          cat "$RUNNER_TEMP/new.stdout" "$RUNNER_TEMP/new.stderr"
          echo "Supported Python exit status: $status"
          test "$status" = 0
          test ! -s "$RUNNER_TEMP/new.stderr"
          grep -Fx '# Codex configuration diagnostic' "$RUNNER_TEMP/new.stdout"
          grep -Fx '1 finding, 0 things not checked.' "$RUNNER_TEMP/new.stdout"

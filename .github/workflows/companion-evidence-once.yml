name: One-time companion evidence for PR 225
on:
  push:
    branches: [launch/212-evidence-once]
    paths: [.github/workflows/companion-evidence-once.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare pinned tools before exposing synthetic inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/companion-build"
          cd "$RUNNER_TEMP/companion-build"
          fetch_binary() {
            local name="$1" url="$2" expected="$3"
            curl --fail --location --show-error --silent --retry 2 "$url" -o "$name.tgz"
            echo "$expected  $name.tgz" | sha256sum --check
            python - "$name" <<'PY'
          import pathlib, sys, tarfile
          name = sys.argv[1]
          with tarfile.open(name + ".tgz") as archive:
              (member,) = [m for m in archive if m.isfile() and pathlib.PurePosixPath(m.name).name == name]
              pathlib.Path(name).write_bytes(archive.extractfile(member).read())
          PY
            chmod 0755 "$name"
            rm "$name.tgz"
          }
          fetch_binary audr https://github.com/harshmaur/audr/releases/download/v0.14.170/audr-v0.14.170-linux-amd64.tar.gz a4980ceb9b3aab4ca4ab298698650b8cb29d33101f1e2257de6a2acaa50a68fa
          fetch_binary betterleaks https://github.com/betterleaks/betterleaks/releases/download/v1.10.1/betterleaks_1.10.1_linux_x64.tar.gz c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e
          fetch_binary gitleaks https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL --retry 2 https://codeload.github.com/ppravdin/agentscrub/tar.gz/6ccecbd7f7db6b6df9ccc3b2f695b4abab2f596f -o agentscrub.tar.gz
          cat > Dockerfile <<'DOCKER'
          FROM python:3.12-slim
          COPY agentscrub.tar.gz /tmp/
          RUN python -m pip install --disable-pip-version-check --no-cache-dir /tmp/agentscrub.tar.gz && rm /tmp/*.tar.gz
          COPY audr betterleaks gitleaks /usr/local/bin/
          DOCKER
          docker build --tag companion-observation .
      - name: Run each command once in its own networkless container
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          for tool in agentscrub; do
            case "$tool" in
              audr) command=(audr scan --no-deps -f json -o - /home/companion) ;;
              betterleaks) command=(betterleaks dir /home/companion/.codex --redact=100 -f json -r -) ;;
              agentscrub) command=(agentscrub scan --only codex) ;;
            esac
            printf '%s command: ' "$tool"
            printf '%q ' "${command[@]}"
            printf '\n'
            code=0
            docker run --rm --network none --read-only --cap-drop=ALL --security-opt no-new-privileges               --user 65534:65534 --cpus 2 --memory 2g --pids-limit 256               --mount "type=bind,source=$PWD/tests/companion_runs/home,target=/input,readonly"               --tmpfs /tmp:rw,nosuid,nodev --tmpfs /home:rw,nosuid,nodev,mode=1777 --workdir /tmp               --env HOME=/home/companion --env NO_COLOR=1 --env TERM=dumb               companion-observation sh -ec 'mkdir /home/companion; cp -R /input/. /home/companion/; mkdir -p /home/companion/.agentscrub/bin; ln -s /usr/local/bin/gitleaks /home/companion/.agentscrub/bin/gitleaks; exec "$@" </dev/null' sh               "${command[@]}" >"$RUNNER_TEMP/$tool.out" 2>"$RUNNER_TEMP/$tool.err" || code=$?
            python - "$tool" "$code" <<'PY'
          import json, os, pathlib, re, sys
          tool, code = sys.argv[1:]
          folder = pathlib.Path(os.environ["RUNNER_TEMP"])
          out = (folder / (tool + ".out")).read_text(errors="replace")
          err = (folder / (tool + ".err")).read_text(errors="replace")
          ansi = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          def message(text):
              return ansi.sub("",text).replace("%","%25").replace("\r","%0D").replace("\n","%0A")
          print(f"::notice title={tool} process::exit {code}")
          for label, value in [("stdout",out),("stderr",err)]:
              for start in range(0, min(len(value), 27000), 3000):
                  print(f"::notice title={tool} {label} {start}::{message(value[start:start+3000])}")
          PY
          done

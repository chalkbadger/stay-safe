name: Verify stay-safe 0.3.0 from PyPI
on:
  push:
    branches: [verify/pypi-0.3.0-207]
permissions:
  contents: read
jobs:
  published-install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c0ad5e5e8a1b2063a754635e4236836a4d5d176f
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Run the documented uvx command outside the checkout
        env:
          SOURCE_REVISION: c0ad5e5e8a1b2063a754635e4236836a4d5d176f
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          work=$(mktemp -d)
          cp tests/understand_inspection_limits/inline-env.toml "$work/"
          cd "$work"
          export UV_CACHE_DIR="$work/cache"
          python -m pip install --index-url https://pypi.org/simple uv==0.13.10
          python --version
          uname -sm
          uvx --python 3.11 stay-safe@0.3.0 --help
          json_status=0
          uvx --python 3.11 stay-safe@0.3.0 --config inline-env.toml --format json > report.json || json_status=$?
          save_status=0
          uvx --python 3.11 stay-safe@0.3.0 --config inline-env.toml --save || save_status=$?
          echo "Exit status: JSON=$json_status HTML=$save_status"
          test "$json_status" = 2
          test "$save_status" = 2
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("report.json").read_text())
          revision = os.environ["SOURCE_REVISION"]
          findings = [(r["rule"], r["entry"]) for r in report["risks"]]
          gaps = report["inspection_gaps"]
          assert report["provenance"]["source_revision"] == revision, report["provenance"]
          assert findings == [("configured_program", "config-1:mcp_servers.example")], findings
          assert gaps == ["config-1: mcp_servers.example.env contains inline values. Check the entries for credentials."], gaps
          (saved,) = Path(".").glob("*.html")
          html = saved.read_text()
          assert "https://github.com/chalkbadger/stay-safe/blob/" + revision + "/" in html
          assert "synthetic-value-not-a-real-credential" not in html + Path("report.json").read_text()
          print(f"Source commit {revision}\nFinding {findings[0]}\nGap {gaps[0]}\nHTML {saved} with source links to release commit")
          PY
      - name: Verify the public tag, release assets, and README source ZIP
        run: |
          set -euo pipefail
          repo=https://github.com/chalkbadger/stay-safe
          revision=c0ad5e5e8a1b2063a754635e4236836a4d5d176f
          test "$(git ls-remote "$repo.git" refs/tags/v0.3.0 | cut -f1)" = "$revision"
          work=$(mktemp -d)
          cd "$work"
          for name in SHA256SUMS stay-safe-0.3.0.zip stay_safe-0.3.0-py3-none-any.whl stay_safe-0.3.0.tar.gz; do
            curl --fail --silent --show-error --location --retry 2 "$repo/releases/download/v0.3.0/$name" -o "$name"
          done
          echo '0ea0b095a13becfbfe31c399fd3276b82a4f31fe361ed0e2e062cd64e24d999a  SHA256SUMS' | sha256sum --check
          sha256sum --check SHA256SUMS
          curl --fail --silent --show-error --location --retry 2 "$repo/archive/refs/tags/v0.3.0.zip" -o readme.zip
          python - <<'PY'
          from zipfile import ZipFile
          revision = b"c0ad5e5e8a1b2063a754635e4236836a4d5d176f"
          with ZipFile("stay-safe-0.3.0.zip") as prepared, ZipFile("readme.zip") as tagged:
              expected = {entry.filename for entry in prepared.infolist() if not entry.is_dir()}
              files = [entry.filename for entry in tagged.infolist() if not entry.is_dir()]
              assert len(files) == len(expected) == 142 and set(files) == expected
              for name in files:
                  assert tagged.read(name) == prepared.read(name), name
              assert tagged.read("stay-safe-0.3.0/stay_safe/release.txt").strip() == revision
              print(f"README tag ZIP: all {len(files)} file paths and contents match the release ZIP.")
          PY
